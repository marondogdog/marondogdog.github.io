<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 丸っこくて可愛い日本語フォントを読み込む -->
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写真 - マロンの日常</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="header">
    <h1>マロンの日常</h1>
    <nav class="nav">
      <ul>
        <li><a href="index.html">トップ</a></li>
        <li><a href="blog.html">ブログ</a></li>
        <li><a href="photos.html">写真</a></li>
        <li><a href="game.html">ゲーム</a></li>
      </ul>
    </nav>
  </header>

  <!-- 写真エリア -->
  <main class="photo-container">
    <h2>写真ギャラリー</h2>

    <!-- 1枚目：クリスマス -->
    <figure class="photo-card">
      <img src="images/photo1.jpeg" alt="赤い服を着たマロン">
      <figcaption>
        <p class="photo-caption">クリスマスシーズン。赤いお洋服を着てパシャリ！</p>
      </figcaption>
    </figure>

    <!-- 2枚目：うちに来た日 -->
    <figure class="photo-card">
      <img src="images/photo2.JPG" alt="抱っこされているマロン">
      <figcaption>
        <p class="photo-caption">うちに来た日。初めての抱っこ。</p>
      </figcaption>
    </figure>

    <!-- 3枚目：ベッド -->
    <figure class="photo-card">
      <img src="images/photo3.JPG" alt="ベッドに入っているマロン">
      <figcaption>
        <p class="photo-caption">すっぽり収まってのんびり中。</p>
      </figcaption>
    </figure>

    <!-- 4枚目：シャンプー -->
    <figure class="photo-card">
      <img src="images/photo4.jpeg" alt="お風呂に入っているマロン">
      <figcaption>
        <p class="photo-caption">シャンプーでさっぱり！</p>
      </figcaption>
    </figure>

    <!-- 5枚目：笑顔 -->
    <figure class="photo-card">
      <img src="images/photo5.JPG" alt="マロンのアップ">
      <figcaption>
        <p class="photo-caption">にっこり笑顔のマロンくん。</p>
      </figcaption>
    </figure>

  </main>

</body>
</html>
