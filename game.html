<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 丸っこくて可愛い日本語フォントを読み込む -->
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>マロンのワンワン骨キャッチ</title>
<style>
  :root{
    --floor-light:#ECE1CC;
    --floor-dark:#D8C7A3;
    --cream:#FBF6EC;
    --brown:#8A6B45;
    --brown-deep:#5E4429;
    --tan:#C9A876;
    --accent:#E0A458;
    --danger:#C97B63;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:'Baloo 2','Hiragino Maru Gothic ProN','Rounded Mplus 1c',sans-serif;
    background:var(--floor-light);
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action:none;
  }
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap');

  #wrap{
    position:relative;
    width:100%;
    height:100vh;
    max-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
      repeating-linear-gradient(90deg,
        var(--floor-light) 0px, var(--floor-light) 54px,
        var(--floor-dark) 54px, var(--floor-dark) 58px);
  }

  #stage{
    position:relative;
    width:100%;
    max-width:460px;
    height:100%;
    max-height:820px;
    background:transparent;
    overflow:hidden;
    box-shadow: 0 0 40px rgba(94,68,41,0.15) inset;
  }

  #hud{
    position:absolute;
    top:0;left:0;right:0;
    z-index:5;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:14px 16px 0 16px;
    pointer-events:none;
  }
  .pill{
    background:var(--cream);
    border:3px solid var(--brown);
    border-radius:20px;
    padding:6px 14px;
    font-weight:700;
    color:var(--brown-deep);
    font-size:17px;
    box-shadow:0 3px 0 rgba(94,68,41,0.25);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .pill .label{
    font-size:11px;
    font-weight:700;
    color:var(--tan);
    letter-spacing:0.02em;
  }
  #hearts{display:flex; gap:3px; font-size:19px;}
  #hearts span{filter:drop-shadow(0 2px 0 rgba(94,68,41,0.2));}

  #banner{
    position:absolute;
    top:64px;left:50%;
    transform:translateX(-50%);
    z-index:6;
    background:var(--accent);
    color:#fff;
    font-weight:800;
    padding:6px 18px;
    border-radius:16px;
    font-size:14px;
    box-shadow:0 3px 0 rgba(94,68,41,0.3);
    opacity:0;
    transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;
    white-space:nowrap;
  }
  #banner.show{opacity:1;}

  canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
  }

  #startScreen, #overScreen{
    position:absolute;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:rgba(251,246,236,0.96);
    padding:24px;
  }
  #startScreen h1, #overScreen h1{
    font-size:26px;
    color:var(--brown-deep);
    margin:0 0 6px 0;
    font-weight:800;
  }
  #startScreen p, #overScreen p{
    color:var(--brown);
    font-size:14.5px;
    line-height:1.6;
    margin:0 0 22px 0;
    max-width:280px;
  }
  #startScreen img.hero, #overScreen img.hero{
    width:120px;
    height:120px;
    border-radius:50%;
    border:5px solid var(--white);
    box-shadow:0 6px 0 rgba(94,68,41,0.2), 0 6px 18px rgba(94,68,41,0.25);
    margin-bottom:16px;
  }
  button.playBtn{
    font-family:inherit;
    font-weight:800;
    font-size:18px;
    color:#fff;
    background:var(--brown);
    border:none;
    border-radius:22px;
    padding:14px 40px;
    box-shadow:0 5px 0 var(--brown-deep);
    cursor:pointer;
    letter-spacing:0.02em;
  }
  button.playBtn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 var(--brown-deep);
  }
  #overScreen .scoreLine{
    font-size:34px;
    font-weight:800;
    color:var(--accent);
    margin-bottom:4px;
  }
  #overScreen .bestLine{
    font-size:13px;
    color:var(--tan);
    font-weight:700;
    margin-bottom:20px;
  }
  #hint{
    position:absolute;
    bottom:14px;left:50%;
    transform:translateX(-50%);
    color:var(--brown);
    opacity:0.55;
    font-size:12px;
    font-weight:700;
    z-index:4;
    pointer-events:none;
  }
  /* もどるボタンのデザイン */
.back-button {
    position: absolute;
    top: 20px;
    left: 20px;
    background-color: #ffffff;
    color: #5c4033;
    padding: 8px 16px;
    border-radius: 20px;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: transform 0.2s;
    z-index: 10;
}
.back-button:hover {
    transform: scale(1.05);
}
.back-button {
        position: absolute;
        top: 20px;
        left: 20px;
        transition: top 0.3s ease;
        z-index: 100;
    }
    .back-button.is-shifted {
        top: 75px !important; 
    }
</style>
</head>

  const stage = document.getElementById('stage');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreVal = document.getElementById('scoreVal');
  const heartsEl = document.getElementById('hearts');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');
  const banner = document.getElementById('banner');
  const hint = document.getElementById('hint');

  let W = 0, H = 0, DPR = 1;
  function resize(){
    const rect = stage.getBoundingClientRect();
    W = rect.width; H = rect.height;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  const dogImg = new Image();
  const boneImg = new Image();
  let assetsReady = 0;
  function assetLoaded(){ assetsReady++; }
  dogImg.onload = assetLoaded; dogImg.src = DOG_SRC;
  boneImg.onload = assetLoaded; boneImg.src = BONE_SRC;

  const DOG_SIZE = 76;
  const BONE_SIZE = 42;
  const MAX_LIVES = 3;

  let dogX = 0;
  let dogTargetX = 0;
  let score = 0;
  let lives = MAX_LIVES;
  let best = 0;
  try{ best = parseInt(localStorage.getItem('boneCatchBest')||'0',10) || 0; }catch(e){ best = 0; }
  let bones = [];
  let particles = [];
  let spawnTimer = 0;
  let spawnInterval = 62;
  let baseSpeed = 2.6;
  let running = false;
  let frame = 0;

  function renderHearts(){
    let s = '';
    for(let i=0;i<MAX_LIVES;i++){
      s += i < lives ? '🦴' : '<span style="opacity:0.25">🦴</span>';
    }
    heartsEl.innerHTML = s;
  }

  function showBanner(text){
    banner.textContent = text;
    banner.classList.add('show');
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(()=>banner.classList.remove('show'), 650);
  }

  function reset(){
    score = 0;
    lives = MAX_LIVES;
    bones = [];
    particles = [];
    spawnTimer = 0;
    spawnInterval = 62;
    baseSpeed = 2.6;
    frame = 0;
    dogX = W/2;
    dogTargetX = W/2;
    scoreVal.textContent = '0';
    renderHearts();
  }

  function spawnBone(){
    const margin = BONE_SIZE;
    const x = margin + Math.random()*(W - margin*2);
    bones.push({
      x, y: -BONE_SIZE,
      r: (Math.random()*40 - 20),
      rv: (Math.random()*2 - 1) * 0.03,
      speed: baseSpeed + Math.random()*1.4,
      caught:false
    });
  }

  function spawnParticles(x,y,color){
    for(let i=0;i<10;i++){
      particles.push({
        x,y,
        vx:(Math.random()*2-1)*3.2,
        vy:(Math.random()*-3-1),
        life:26,
        color
      });
    }
  }

  function update(){
    frame++;
    dogX += (dogTargetX - dogX) * 0.22;
    const half = DOG_SIZE/2;
    dogX = Math.max(half+4, Math.min(W-half-4, dogX));

    spawnTimer++;
    if(spawnTimer >= spawnInterval){
      spawnTimer = 0;
      spawnBone();
      if(spawnInterval > 30) spawnInterval -= 0.5;
      baseSpeed += 0.015;
    }

    const dogTop = H - DOG_SIZE - 18;
    const catchY = dogTop + DOG_SIZE*0.32;

    for(let i=bones.length-1;i>=0;i--){
      const b = bones[i];
      b.y += b.speed;
      b.r += b.rv;

      if(!b.caught){
        const dx = b.x - dogX;
        const dy = b.y - (catchY);
        const distX = Math.abs(dx);
        const distY = Math.abs(dy);
        if(distX < (DOG_SIZE*0.42) && distY < (DOG_SIZE*0.4) && b.y > dogTop){
          b.caught = true;
          score++;
          scoreVal.textContent = score;
          spawnParticles(b.x, b.y, '#E0A458');
          if(score % 5 === 0){
            showBanner(score + ' 個ゲット！ 🎉');
          }
          bones.splice(i,1);
          continue;
        }
      }

      if(b.y > H + BONE_SIZE){
        bones.splice(i,1);
        lives--;
        renderHearts();
        spawnParticles(b.x, H-30, '#C97B63');
        if(lives <= 0){
          endGame();
          return;
        }
      }
    }

    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
      if(p.life<=0) particles.splice(i,1);
    }
  }

  function drawFloor(){
    ctx.fillStyle = '#F3E9D4';
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(180,150,100,0.18)';
    ctx.lineWidth = 2;
    const plank = 58;
    for(let x=-plank; x<W+plank; x+=plank){
      ctx.beginPath();
      ctx.moveTo(x,0); ctx.lineTo(x,H);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(180,150,100,0.10)';
    for(let y=40; y<H; y+=140){
      ctx.beginPath();
      ctx.moveTo(0,y); ctx.lineTo(W,y);
      ctx.stroke();
    }
  }

  function draw(){
    drawFloor();

    // bone shadows + bones
    bones.forEach(b=>{
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.beginPath();
      ctx.ellipse(b.x, Math.min(b.y+BONE_SIZE*0.4, H-14), BONE_SIZE*0.32, BONE_SIZE*0.12, 0, 0, Math.PI*2);
      ctx.fillStyle = '#5E4429';
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(b.x,b.y);
      ctx.rotate(b.r * Math.PI/180);
      ctx.drawImage(boneImg, -BONE_SIZE/2, -BONE_SIZE/2, BONE_SIZE, BONE_SIZE);
      ctx.restore();
    });

    // particles
    particles.forEach(p=>{
      ctx.globalAlpha = Math.max(p.life/26,0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,3.2,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    // dog
    const dogTop = H - DOG_SIZE - 18;
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.beginPath();
    ctx.ellipse(dogX, H-16, DOG_SIZE*0.4, 8, 0, 0, Math.PI*2);
    ctx.fillStyle = '#5E4429';
    ctx.fill();
    ctx.restore();

    const bob = Math.sin(frame*0.15) * 2;
    ctx.save();
    ctx.beginPath();
    ctx.arc(dogX, dogTop + DOG_SIZE/2 + bob, DOG_SIZE/2 + 4, 0, Math.PI*2);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.arc(dogX, dogTop + DOG_SIZE/2 + bob, DOG_SIZE/2, 0, Math.PI*2);
    ctx.clip();
    ctx.drawImage(dogImg, dogX-DOG_SIZE/2, dogTop+bob, DOG_SIZE, DOG_SIZE);
    ctx.restore();
  }

  function loop(){
    if(!running) return;
    update();
    draw();
    requestAnimationFrame(loop);
  }

  function endGame(){
    running = false;
    if(score > best){
      best = score;
      try{ localStorage.setItem('boneCatchBest', String(best)); }catch(e){}
    }
    finalScoreEl.textContent = score + ' 個';
    bestScoreEl.textContent = '最高記録：' + best + ' 個';
    overScreen.style.display = 'flex';
  }

  function startGame(){
    resize();
    reset();
    startScreen.style.display = 'none';
    overScreen.style.display = 'none';
    running = true;
    hint.style.opacity = '0.55';
    requestAnimationFrame(loop);
    setTimeout(()=>{ hint.style.transition='opacity .8s'; hint.style.opacity='0'; }, 2600);
  }

  function pointerToX(clientX){
    const rect = stage.getBoundingClientRect();
    return clientX - rect.left;
  }

  stage.addEventListener('touchstart', e=>{
    if(!running) return;
    dogTargetX = pointerToX(e.touches[0].clientX);
  }, {passive:true});
  stage.addEventListener('touchmove', e=>{
    if(!running) return;
    dogTargetX = pointerToX(e.touches[0].clientX);
  }, {passive:true});

  let mouseDown = false;
  stage.addEventListener('mousedown', e=>{ mouseDown = true; if(running) dogTargetX = pointerToX(e.clientX); });
  window.addEventListener('mouseup', ()=> mouseDown = false);
  stage.addEventListener('mousemove', e=>{ if(running && mouseDown) dogTargetX = pointerToX(e.clientX); });

  window.addEventListener('keydown', e=>{
    if(!running) return;
    if(e.key === 'ArrowLeft') dogTargetX -= 40;
    if(e.key === 'ArrowRight') dogTargetX += 40;
  });

  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  resize();
  renderHearts();
  bestScoreEl.textContent = '最高記録：' + best + ' 個';
})();
</script>

              backBtn.classList.add('is-shifted');
